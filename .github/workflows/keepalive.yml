# Il piano gratuito di Supabase mette in pausa i progetti dopo 7 giorni senza attività.
# Questo job "tocca" il database ogni 3 giorni. Richiede due secrets del repository:
# SUPABASE_URL e SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions).
name: Tieni sveglio Supabase
on:
  schedule: [{ cron: "17 6 */3 * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/tipi_bici?select=id&limit=1" -H "apikey: $KEY")
          echo "HTTP $code"; test "$code" = "200"
